<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Blank
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Blank</ion-title>
    </ion-toolbar>
  </ion-header>

<h2 class = "ion-padding-start">Log last nights sleep</h2>
<ion-item>
  <ion-input label="Went to bed" labelPlacement = "stacked" type = "datetime-local" [(ngModel)]="bedtime"></ion-input>
</ion-item>
<ion-item>
  <ion-input label="Woke up" labelPlacement = "stacked" type = "datetime-local" [(ngModel)]="wakeTime"></ion-input>
</ion-item>
<ion-button expand = "block" class = "ion-margin" (click) = "logSleep()">Save sleep</ion-button>
</ion-content>
