<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Blank
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Blank</ion-title>
    </ion-toolbar>
  </ion-header>

<h2 class = "ion-padding-start">Log last nights sleep</h2>
<ion-item>
  <ion-label>Went to bed</ion-label>
  <ion-datetime-button datetime = "bedtime"></ion-datetime-button>
</ion-item>
<ion-item>
  <ion-label>Woke up</ion-label>
  <ion-datetime-button datetime = "waketime"></ion-datetime-button>
</ion-item>

<ion-modal [keepContentsMounted] = "true">
  <ng-template>
    <ion-datetime id= "bedtime" [(ngModel)] = "bedtime"></ion-datetime>
  </ng-template>
</ion-modal>
<ion-modal [keepContentsMounted]="true">
  <ng-template>
    <ion-datetime id="waketime" [(ngModel)]= "wakeTime"></ion-datetime>
  </ng-template>
</ion-modal>

<ion-button expand = "block" class = "ion-margin" (click) = "logSleep()">Save sleep</ion-button>
<h2 class = "ion-padding-start">Logs</h2>
<ion-list>
  @for(log of allSleepData; track log.id){
    <ion-item>
      <ion-label>
        <h3>{{log.summaryString()}}</h3>
        <p>{{log.dateString()}}</p>
      </ion-label>
    </ion-item>
  }
  @empty{
    <ion-item>
      <ion-label>No logs</ion-label>
    </ion-item>
  }
</ion-list>
</ion-content>
